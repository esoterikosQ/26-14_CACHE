[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phdq-blt-cache"
version = "0.1.0"
description = "Experimental incremental generation cache for the PHDQ BLT model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.11,<3"]

[project.optional-dependencies]
patcher = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["src"]
